<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">Following an RFI to the money behind it</title><desc id="d">An RFI is linked to the spec section and submittals it came from, and to the change event, change order, cost lines and pay application it led to. A trace walks the links in both directions.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#f2f2f7"/></linearGradient><filter id="sh" x="-8%" y="-8%" width="116%" height="128%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000" flood-opacity="0.07"/></filter></defs><rect width="1200" height="470" rx="28" fill="url(#bg)"/><rect x=".5" y=".5" width="1199" height="469" rx="28" fill="none" stroke="#e5e5ea"/><text x="56" y="84" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="38" font-weight="700" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.6">From an RFI to the money behind it</text><text x="56" y="118" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="17" font-weight="400" fill="#6e6e73" text-anchor="start">Linked records, followed in both directions, with the source of every one.</text><rect x="56" y="160" width="168" height="74" rx="18" fill="#ffffff" stroke="#e5e5ea" stroke-width="1" filter="url(#sh)"/><circle cx="76" cy="186" r="5" fill="#30b0c7"/><text x="90" y="191" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="start">Spec section</text><text x="76" y="214" font-family='ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace' font-size="13" font-weight="500" fill="#6e6e73" text-anchor="s